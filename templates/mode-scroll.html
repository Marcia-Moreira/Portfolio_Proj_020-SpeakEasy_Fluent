<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modo Rolagem</title>

  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body id="topo">

<header>
    <div class="nav">
        <!-- <div class="logo">🎙️SpeakEasy Fluent</div> -->
        <a href="../index.html">
          <div class="logo">🎙️️SpeakEasy Fluent</div>
        </a>

        <nav class="nav-item">
            <a href="../index.html">Home</a>
            <a href="study-list.html">Listas</a>
        </nav>
    </div>
</header>

<main class="mode-scroll">

  <!-- LINHA 1 -->
  <h2 id="titulo-lista"></h2>

  <!-- LINHA 2 -->
  <!-- CONTROLES DO SCROLLER -->
  <div class="controls-top">
    <label>
      Velocidade:
      <input type="range" id="speed" min="1" max="100" value="50">
      <span id="velocidade-display">50%</span>
    </label>

    <label>
      <input type="checkbox" id="toggle-pt" checked>
      Mostrar tradução
    </label>
  </div>

  <!-- LINHA 3 -->
  <div class="controls-buttons">
    <button id="playScroll">▶️ Play</button>
    <button id="pauseScroll">⏸️ Pause</button>
    <button id="resetScroll">🔄 Reset</button>
  </div>

  <!-- CONTAINER SCROLL -->
  <div class="scroll-container">
    <div id="scroll-content" class="scroll-content"></div>
    <!-- As frases serão inseridas aqui pelo JS -->
  </div>

</main>

<!-- Link para voltar ao topo - verificar icon seta pra cima-->
<a href="#topo" class="btn-topo">Voltar para a Home/Topo</a>

<script type="module" src="../js/mode-scroll.js"></script>

</body>
</html>
